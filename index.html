<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标志展开</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#ffffff;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display",
                "PingFang SC", "Helvetica Neue", sans-serif;
    color:#111;
    -webkit-font-smoothing:antialiased;
  }

  .stage {
    position:relative;
    width:100vw; height:100vh;
    overflow:hidden;
    background:#ffffff;
  }

  /* ============ 主照片切片 ============ */
  .slice {
    position:absolute;
    left:50%; top:50%;
    pointer-events:none;
    z-index:9;
    will-change:transform, opacity;
  }

  /* 轮廓描边：不是矩形边框，是给图片内容的非透明像素描黑边 */
  .slice img {
    display:block;
    max-width:60vw;
    max-height:45vh;
    width:auto;
    height:auto;
    filter:
      drop-shadow(1px 0 0 #000)
      drop-shadow(-1px 0 0 #000)
      drop-shadow(0 1px 0 #000)
      drop-shadow(0 -1px 0 #000)
      drop-shadow(1px 1px 0 #000)
      drop-shadow(-1px -1px 0 #000)
      drop-shadow(1px -1px 0 #000)
      drop-shadow(-1px 1px 0 #000);
  }

  .grid {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:4vh;
    padding:6vh 6vw;
    z-index:5;
  }

  .grid-row {
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:12vw;
  }

  .item {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(10px, 1.4vh, 18px);
    width:clamp(180px, 26vw, 300px);
  }

  .logo-box {
    width:clamp(90px, 13vh, 150px);
    height:clamp(90px, 13vh, 150px);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    will-change:transform, opacity;
  }

  .item.center-large .logo-box {
    width:clamp(110px, 15.5vh, 175px);
    height:clamp(110px, 15.5vh, 175px);
  }

  .logo-inner {
    width:100%; height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* 5 个标志：也加轮廓描边 */
  .logo-inner img {
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    filter:
      drop-shadow(2px 0 0 #000)
      drop-shadow(-2px 0 0 #000)
      drop-shadow(0 2px 0 #000)
      drop-shadow(0 -2px 0 #000)
      drop-shadow(2px 2px 0 #000)
      drop-shadow(-2px -2px 0 #000)
      drop-shadow(2px -2px 0 #000)
      drop-shadow(-2px 2px 0 #000);
    transition:transform .5s cubic-bezier(.16,1,.3,1);
  }

  .item:hover .logo-inner img {
    transform:scale(1.08);
  }

  .item-text {
    text-align:center;
    opacity:0;
    will-change:transform, opacity;
  }

  .item-text h3 {
    font-size:clamp(.92rem, 1.15vw, 1.05rem);
    font-weight:700;
    color:#111;
    margin-bottom:.35em;
    letter-spacing:-.01em;
  }

  .item-text p {
    font-size:clamp(.7rem, .85vw, .82rem);
    line-height:1.6;
    color:#999;
  }
</style>
</head>
<body>
<div class="stage">

  <!-- 主照片 -->
  <div id="heroTemplate" style="display:none;">
    <img src="retouch_2026100221285681.png" alt="主照片">
  </div>

  <div id="sliceLayer"></div>

  <!-- 5 个标志 + 文字 -->
  <div class="grid">

    <div class="grid-row">
      <div class="item">
        <div class="logo-box">
          <div class="logo-inner">
            <img src="mmexport1790943653817.jpg" alt="标志 01">
          </div>
        </div>
        <div class="item-text">
          <h3>项目一</h3>
          <p>这里是第一个项目的简短介绍</p>
        </div>
      </div>
      <div class="item">
        <div class="logo-box">
          <div class="logo-inner">
            <img src="mmexport1790943655712.jpg" alt="标志 02">
          </div>
        </div>
        <div class="item-text">
          <h3>项目二</h3>
          <p>这里是第二个项目的简短介绍</p>
        </div>
      </div>
    </div>

    <div class="grid-row">
      <div class="item">
        <div class="logo-box">
          <div class="logo-inner">
            <img src="retouch_2026100220223400.png" alt="标志 03">
          </div>
        </div>
        <div class="item-text">
          <h3>项目三</h3>
          <p>这里是第三个项目的简短介绍</p>
        </div>
      </div>
      <div class="item">
        <div class="logo-box">
          <div class="logo-inner">
            <img src="retouch_2026100220394892.png" alt="标志 04">
          </div>
        </div>
        <div class="item-text">
          <h3>项目四</h3>
          <p>这里是第四个项目的简短介绍</p>
        </div>
      </div>
    </div>

    <div class="grid-row">
      <div class="item center-large">
        <div class="logo-box">
          <div class="logo-inner">
            <img src="retouch_2026100220405881.png" alt="标志 05">
          </div>
        </div>
        <div class="item-text">
          <h3>项目五</h3>
          <p>这里是第五个项目的简短介绍</p>
        </div>
      </div>
    </div>

  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  const stage      = document.querySelector('.stage');
  const sliceLayer = document.getElementById('sliceLayer');
  const items      = Array.from(document.querySelectorAll('.item'));

  const SLICE_COUNT = items.length;   // 5

  const heroHTML = document.getElementById('heroTemplate').innerHTML;

  /* ============ 生成 5 个竖切条 ============
     关键：每条切片用 clip-path 把原图裁成"竖条"，
     拼在一起 = 完整图；分开了 = 5 块独立的碎片。
     不是复制，是同一张原图被切成 5 段。
  ============================================ */
  const slices = [];
  for (let i = 0; i < SLICE_COUNT; i++) {
    const s = document.createElement('div');
    s.className = 'slice';

    const leftPct  = (i / SLICE_COUNT) * 100;
    const rightPct = ((SLICE_COUNT - 1 - i) / SLICE_COUNT) * 100;

    // 无重叠：每片显示自己那 20% 的竖条，拼起来正好是整张
    s.style.clipPath = `inset(0% ${rightPct}% 0% ${leftPct}%)`;

    s.innerHTML = heroHTML;
    sliceLayer.appendChild(s);
    slices.push(s);
  }

  let ctx = null;

  function measure() {
    const sr = stage.getBoundingClientRect();
    const cx = sr.width  / 2;
    const cy = sr.height / 2;

    items.forEach((item, i) => {
      const box = item.querySelector('.logo-box');
      const r   = box.getBoundingClientRect();
      const lx  = r.left - sr.left + r.width  / 2;
      const ly  = r.top  - sr.top  + r.height / 2;
      slices[i]._dx = lx - cx;
      slices[i]._dy = ly - cy;
    });
  }

  function build() {
    ctx = gsap.context(() => {
      const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

      gsap.set(slices, {
        xPercent: -50, yPercent: -50,
        x: 0, y: 0,
        opacity: 0, scale: 0.88,
        y: 0
      });
      gsap.set('.logo-box',  { opacity: 0, scale: 0.4 });
      gsap.set('.item-text', { opacity: 0, y: 16 });

      /* ========== 阶段 1：主照片出现（0.9s） ========== */
      tl.to(slices, {
        opacity: 1, scale: 1,
        duration: 0.9, ease: 'power3.out'
      }, 0);

      /* 停留 0.5s 看清主照片 */
      tl.to({}, { duration: 0.5 }, 0.9);

      /* ========== 阶段 2：全部切片微微错开（"切开"瞬间） ========== */
      const cutT = 1.4;
      slices.forEach((s, i) => {
        // 相邻切片往相反方向错开 2px，露出白缝，像真的被切开
        const dir = i % 2 === 0 ? -1 : 1;
        tl.to(s, {
          y: dir * 2,
          duration: 0.15,
          ease: 'power2.out'
        }, cutT);
      });

      /* ========== 阶段 3：一块一块飞走（真切片，不是渐隐） ========== */
      const flyT = 1.55;
      const sliceStagger = 0.16;   // 错开 160ms，一块一块感更强

      slices.forEach((s, i) => {
        const t0 = flyT + i * sliceStagger;

        // 保持清晰、保持大小，直线飞到目标位置
        tl.to(s, {
          x: s._dx,
          y: s._dy,
          duration: 0.85,
          ease: 'power2.inOut'
        }, t0);

        // 到达后才淡出（不是慢慢淡，是"到位后消失"）
        tl.to(s, {
          opacity: 0,
          duration: 0.2,
          ease: 'power1.in'
        }, t0 + 0.68);
      });

      /* ========== 阶段 4：标志 + 文字浮现 ========== */
      const logoStart = flyT + 0.7;
      items.forEach((item, i) => {
        const t0 = logoStart + i * 0.08;

        tl.to(item.querySelector('.logo-box'), {
          opacity: 1, scale: 1,
          duration: 0.6, ease: 'power3.out'
        }, t0);

        tl.to(item.querySelector('.item-text'), {
          opacity: 1, y: 0,
          duration: 0.6, ease: 'power3.out'
        }, t0 + 0.2);
      });
    }, stage);
  }

  function init() {
    if (ctx) ctx.revert();
    gsap.set([slices, '.logo-box', '.item-text'], { clearProps: 'all' });
    void stage.offsetHeight;
    measure();
    build();
  }

  if (document.readyState === 'complete') init();
  else window.addEventListener('load', init);

  let t;
  window.addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(init, 300);
  });
})();
</script>
</body>
</html>
