<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标志展开</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#ffffff;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display",
                "PingFang SC", "Helvetica Neue", sans-serif;
    color:#111;
    -webkit-font-smoothing:antialiased;
  }

  .stage {
    position:relative;
    width:100vw; height:100vh;
    overflow:hidden;
    background:#ffffff;
  }

  /* ============ 主照片的切片 ============
     每条是一个独立的长条 div，里面放一张"宽 500%"的图，
     只显示其中 1/5 —— 这就是"切"，不是"复制 5 份完整图"。 */
  .slice {
    position:absolute;
    left:50%; top:50%;
    pointer-events:none;
    z-index:9;
    overflow:hidden;
    will-change:transform, opacity;
  }

  .slice img {
    display:block;
    height:100%;
    width:auto;
    max-width:none;
    position:absolute;
    top:0;
    /* 主照片：无黑边 */
  }

  .grid {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:4vh;
    padding:6vh 6vw;
    z-index:5;
  }

  .grid-row {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12vw;
  }

  .item {
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }

  .logo-box {
    width:clamp(100px, 14vh, 160px);
    height:clamp(100px, 14vh, 160px);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    will-change:transform, opacity;
  }

  .item.center-large .logo-box {
    width:clamp(120px, 17vh, 190px);
    height:clamp(120px, 17vh, 190px);
  }

  .logo-inner {
    width:100%; height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* 5 个标志：超级细黑边 —— 四个方向 0.5px 叠加，只勾轮廓 */
  .logo-inner img {
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    filter:
      drop-shadow(0.5px 0 0 #000)
      drop-shadow(-0.5px 0 0 #000)
      drop-shadow(0 0.5px 0 #000)
      drop-shadow(0 -0.5px 0 #000);
    transition:transform .5s cubic-bezier(.16,1,.3,1);
  }

  .item:hover .logo-inner img {
    transform:scale(1.06);
  }

  /* ============ 点击后的详情浮层 ============ */
  .overlay {
    position:fixed;
    inset:0;
    background:#ffffff;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:10vh;
    opacity:0;
    pointer-events:none;
  }
  .overlay.active {
    opacity:1;
    pointer-events:auto;
  }

  .detail-img {
    width:min(46vw, 380px);
    height:min(46vw, 380px);
    display:flex;
    align-items:center;
    justify-content:center;
    will-change:transform;
  }

  .detail-img img {
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
  }

  .detail-panel {
    margin-top:6vh;
    max-width:720px;
    padding:0 6vw;
    text-align:center;
    opacity:0;
    will-change:transform, opacity;
  }

  .detail-panel h2 {
    font-size:clamp(1.3rem, 2.4vw, 2rem);
    font-weight:700;
    color:#111;
    margin-bottom:.6em;
    letter-spacing:-.01em;
  }

  .detail-panel p {
    font-size:clamp(.85rem, 1.05vw, 1rem);
    line-height:1.8;
    color:#888;
    min-height:6em;
  }

  .close-hint {
    position:fixed;
    bottom:3vh;
    left:50%;
    transform:translateX(-50%);
    font-size:.75rem;
    color:#bbb;
    letter-spacing:.2em;
    z-index:101;
    opacity:0;
    pointer-events:none;
  }
  .overlay.active ~ .close-hint { opacity:1; }
</style>
</head>
<body>
<div class="stage">

  <!-- 主照片：用 <img> 直接量出尺寸 -->
  <img id="heroSource" src="retouch_2026100221285681.png"
       alt="" style="position:absolute;visibility:hidden;pointer-events:none;">

  <div id="sliceLayer"></div>

  <!-- 5 个标志 -->
  <div class="grid">

    <div class="grid-row">
      <div class="item">
        <div class="logo-box">
          <div class="logo-inner">
            <img src="mmexport1790943653817.jpg" alt="标志 01">
          </div>
        </div>
      </div>
      <div class="item">
        <div class="logo-box">
          <div class="logo-inner">
            <img src="mmexport1790943655712.jpg" alt="标志 02">
          </div>
        </div>
      </div>
    </div>

    <div class="grid-row">
      <div class="item">
        <div class="logo-box">
          <div class="logo-inner">
            <img src="retouch_2026100220223400.png" alt="标志 03">
          </div>
        </div>
      </div>
      <div class="item">
        <div class="logo-box">
          <div class="logo-inner">
            <img src="retouch_2026100220394892.png" alt="标志 04">
          </div>
        </div>
      </div>
    </div>

    <div class="grid-row">
      <div class="item center-large">
        <div class="logo-box">
          <div class="logo-inner">
            <img src="retouch_2026100220405881.png" alt="标志 05">
          </div>
        </div>
      </div>
    </div>

  </div>

</div>

<!-- 详情浮层 -->
<div class="overlay" id="overlay">
  <div class="detail-img" id="detailImg"></div>
  <div class="detail-panel" id="detailPanel">
    <h2 id="detailTitle">标题</h2>
    <p id="detailText">这里是介绍内容（空白，等你来填）</p>
  </div>
</div>
<div class="close-hint" id="closeHint">点击任意处关闭</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  const stage      = document.querySelector('.stage');
  const sliceLayer = document.getElementById('sliceLayer');
  const items      = Array.from(document.querySelectorAll('.item'));
  const heroSrc    = document.getElementById('heroSource');

  const overlay     = document.getElementById('overlay');
  const detailImg   = document.getElementById('detailImg');
  const detailPanel = document.getElementById('detailPanel');
  const detailTitle = document.getElementById('detailTitle');
  const detailText  = document.getElementById('detailText');

  const SLICE_COUNT = items.length;   // 5

  const slices = [];
  let measured  = false;

  /* ============ 关键：真正"切开" ============
     1. 先量出主照片的原尺寸
     2. 建 5 个宽 = 原宽/5 的长条 div
     3. 每个长条里放一张"宽 = 原宽"的完整图片
     4. 用 overflow:hidden + 图片的 left 偏移，只露出属于这一条的那 1/5
     —— 这就是"一张图切成 5 条"，不是"5 张一样的图叠一起"。 */
  function buildSlices() {
    // 清空旧的
    sliceLayer.innerHTML = '';
    slices.length = 0;

    const iw = heroSrc.naturalWidth;
    const ih = heroSrc.naturalHeight;
    if (!iw || !ih) return;

    // 屏幕显示尺寸（限制最大宽高）
    const maxW = Math.min(window.innerWidth  * 0.60, iw);
    const maxH = Math.min(window.innerHeight * 0.45, ih);
    const ratio = Math.min(maxW / iw, maxH / ih);
    const W = iw * ratio;
    const H = ih * ratio;
    const sliceW = W / SLICE_COUNT;

    for (let i = 0; i < SLICE_COUNT; i++) {
      const s = document.createElement('div');
      s.className = 'slice';
      s.style.width  = sliceW + 'px';
      s.style.height = H + 'px';

      // 每条里放一张完整尺寸的图，用负 left 偏移，露出对应那一条
      const img = document.createElement('img');
      img.src = heroSrc.src;
      img.style.width = W + 'px';
      img.style.height = H + 'px';
      img.style.left = (-i * sliceW) + 'px';
      img.style.position = 'absolute';
      img.style.top = '0';
      img.style.maxWidth = 'none';

      s.appendChild(img);
      sliceLayer.appendChild(s);
      slices.push(s);
    }
    measured = true;
  }

  function measureTargets() {
    const sr = stage.getBoundingClientRect();
    const cx = sr.width  / 2;
    const cy = sr.height / 2;

    items.forEach((item, i) => {
      const box = item.querySelector('.logo-box');
      const r   = box.getBoundingClientRect();
      const lx  = r.left - sr.left + r.width  / 2;
      const ly  = r.top  - sr.top  + r.height / 2;
      slices[i]._dx = lx - cx;
      slices[i]._dy = ly - cy;
    });
  }

  function build() {
    ctx = gsap.context(() => {
      const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

      /* 初始状态：5 条完全拼合（=完整的图），居中 */
      gsap.set(slices, {
        xPercent: -50, yPercent: -50,
        x: 0, y: 0,
        opacity: 0, scale: 0.88
      });
      gsap.set('.logo-box', { opacity: 0, scale: 0.4 });

      /* ---------- 阶段 1：整张图出现（0.9s） ---------- */
      tl.to(slices, {
        opacity: 1, scale: 1,
        duration: 0.9, ease: 'power3.out'
      }, 0);

      /* 停留 0.5s，让用户看清完整的图 */
      tl.to({}, { duration: 0.5 }, 0.9);

      /* ---------- 阶段 2：切开瞬间（一条一条"崩开"） ----------
         每条错开 40ms，每条平行错位几像素，
         让"整张图裂成 5 条"这件事发生在眼睛底下。
      */
      const crackT = 1.4;
      const crackStagger = 0.04;

      slices.forEach((s, i) => {
        // 相邻条往相反方向轻微错位
        const dir = i % 2 === 0 ? -1 : 1;
        tl.to(s, {
          y: dir * 4,
          duration: 0.15,
          ease: 'power2.out'
        }, crackT + i * crackStagger);
      });

      /* ---------- 阶段 3：一条一条飞走 ----------
         错开 320ms —— 第 1 条飞走时，其他 4 条还在原位，
         你能清楚看到"图上少了一条"。
      */
      const flyT = 1.75;
      const sliceStagger = 0.32;

      slices.forEach((s, i) => {
        const t0 = flyT + i * sliceStagger;

        tl.to(s, {
          x: s._dx,
          y: s._dy,
          duration: 0.7,
          ease: 'power2.inOut'
        }, t0);

        // 到位后立即消失（不慢慢淡，是"到位即消失"）
        tl.to(s, {
          opacity: 0,
          duration: 0.12,
          ease: 'none'
        }, t0 + 0.6);
      });

      /* ---------- 阶段 4：5 个标志逐个浮现 ---------- */
      const logoStart = flyT + 0.6;
      items.forEach((item, i) => {
        tl.to(item.querySelector('.logo-box'), {
          opacity: 1, scale: 1,
          duration: 0.6, ease: 'power3.out'
        }, logoStart + i * 0.1);
      });
    }, stage);
  }

  let ctx = null;

  function init() {
    if (ctx) ctx.revert();
    gsap.set([slices, '.logo-box'], { clearProps: 'all' });

    // 每次都重新生成切片（尺寸会变）
    buildSlices();
    if (!measured) return;

    void stage.offsetHeight;
    measureTargets();
    build();
  }

  /* 等主照片加载完才量尺寸 */
  if (heroSrc.complete && heroSrc.naturalWidth) {
    init();
  } else {
    heroSrc.addEventListener('load', init);
  }

  let t;
  window.addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(init, 300);
  });

  /* ================================================
     点击标志 → 图片飞中心 → 上移 → 弹介绍
     ================================================ */
  let isOpen = false;

  function openDetail(item) {
    if (isOpen) return;
    isOpen = true;

    const srcImg = item.querySelector('.logo-inner img');
    const src = srcImg.src;

    const first = srcImg.getBoundingClientRect();

    detailImg.innerHTML = `<img src="${src}" alt="">`;
    detailTitle.textContent = '标题';   // ← 以后在这里填标题
    detailText.textContent  = '';        // ← 以后在这里填介绍

    overlay.classList.add('active');

    const last = detailImg.getBoundingClientRect();

    const dx = (first.left + first.width  / 2) - (last.left + last.width  / 2);
    const dy = (first.top  + first.height / 2) - (last.top  + last.height / 2);
    const sc = first.width / last.width;

    gsap.set(detailImg, { x: dx, y: dy, scale: sc });
    gsap.set(detailPanel, { opacity: 0, y: 40 });

    const tl = gsap.timeline();

    tl.to(detailImg, {
      x: 0, y: 0, scale: 1,
      duration: 0.75,
      ease: 'power3.out'
    });

    tl.to(detailImg, {
      y: -30,
      duration: 0.5,
      ease: 'power2.out'
    }, '-=0.15');

    tl.to(detailPanel, {
      opacity: 1, y: 0,
      duration: 0.6,
      ease: 'power3.out'
    }, '-=0.3');
  }

  function closeDetail() {
    if (!isOpen) return;
    isOpen = false;
    overlay.classList.remove('active');
    detailImg.innerHTML = '';
  }

  items.forEach(item => {
    item.addEventListener('click', () => openDetail(item));
  });

  overlay.addEventListener('click', closeDetail);
})();
</script>
</body>
</html>
