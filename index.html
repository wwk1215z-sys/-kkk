<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>纯净 · 管理鱼缸</title>
    <style>
        /* ===== 极简重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 24px;
        }

        /* ===== 主容器 ===== */
        .container {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.02);
            transition: all 0.2s;
        }

        /* ===== 打字机标题 ===== */
        .title-wrapper {
            width: 100%;
            min-height: 64px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 28px;
        }

        #typewriter {
            font-size: clamp(26px, 6vw, 38px);
            font-weight: 600;
            color: #000000;
            letter-spacing: 0.5px;
            line-height: 1.3;
            text-align: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 1.4em;
            word-break: keep-all;
        }

        /* 打字光标 */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 0.9em;
            background: #000;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.9s step-end infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        /* ===== 小鱼 ===== */
        .fish-area {
            width: 100%;
            padding: 30px 0 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fish-emoji {
            font-size: clamp(80px, 25vw, 140px);
            line-height: 1;
            display: inline-block;
            animation: floatFish 3.6s ease-in-out infinite;
            filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.03));
            user-select: none;
        }

        @keyframes floatFish {
            0% {
                transform: translateY(0px) rotate(0deg);
            }
            30% {
                transform: translateY(-14px) rotate(2deg);
            }
            60% {
                transform: translateY(6px) rotate(-1deg);
            }
            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }

        /* ===== 下载按钮区域 ===== */
        .download-section {
            width: 100%;
            margin-top: 32px;
            display: flex;
            justify-content: center;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #000000;
            color: #ffffff;
            font-size: clamp(18px, 4vw, 22px);
            font-weight: 500;
            padding: 16px 48px;
            border-radius: 60px;
            border: none;
            outline: none;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            letter-spacing: 0.3px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-decoration: none;
            user-select: none;
            width: 100%;
            max-width: 320px;
        }

        .download-btn:hover {
            background: #1a1a1a;
            transform: scale(1.01);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
        }

        .download-btn:active {
            transform: scale(0.97);
            background: #2a2a2a;
        }

        .download-btn .icon {
            font-size: 1.2em;
            line-height: 1;
            transition: transform 0.2s ease;
        }

        .download-btn:hover .icon {
            transform: translateY(1px);
        }

        /* ===== 下方极简脚标 ===== */
        .footer-note {
            margin-top: 24px;
            font-size: 13px;
            color: #aaaaaa;
            letter-spacing: 0.5px;
            font-weight: 400;
            transition: color 0.2s;
        }

        .footer-note:hover {
            color: #888888;
        }

        /* ===== 响应式微调 ===== */
        @media (max-width: 480px) {
            .container {
                padding: 28px 16px;
            }

            .download-btn {
                padding: 14px 32px;
                font-size: 17px;
                max-width: 260px;
            }

            #typewriter {
                font-size: 24px;
            }

            .fish-emoji {
                font-size: 72px;
            }
        }

        @media (max-width: 380px) {
            #typewriter {
                font-size: 20px;
            }

            .fish-emoji {
                font-size: 60px;
            }

            .download-btn {
                padding: 12px 24px;
                font-size: 15px;
                max-width: 220px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 打字机标题 -->
        <div class="title-wrapper">
            <div id="typewriter"></div>
        </div>

        <!-- 待机小鱼 -->
        <div class="fish-area">
            <span class="fish-emoji">🐟</span>
        </div>

        <!-- 下载按钮 -->
        <div class="download-section">
            <button class="download-btn" id="downloadBtn">
                <span class="icon">⬇</span>
                下载软件
                <span style="font-size:0.7em; opacity:0.6; font-weight:300;">·</span>
                <span style="font-weight:300; font-size:0.8em; opacity:0.7;">蓝奏云</span>
            </button>
        </div>

        <!-- 极简脚标 (可选) -->
        <div class="footer-note">管理鱼缸 · 纯净版</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. 打字机效果
            // ============================================================
            const text = '纯净的管理鱼缸软件';
            const typewriterEl = document.getElementById('typewriter');
            let index = 0;
            let isDeleting = false; // 我们只做打字，不做删除
            let isComplete = false;

            function typeStep() {
                if (index < text.length) {
                    // 正常打字
                    const currentText = text.substring(0, index + 1);
                    typewriterEl.innerHTML = currentText + '<span class="cursor"></span>';
                    index++;
                    // 正常打字速度：约 50~70ms 一个字，模拟真实打字
                    const delay = 55 + Math.random() * 30;
                    setTimeout(typeStep, delay);
                } else {
                    // 打字完成，光标保持闪烁
                    typewriterEl.innerHTML = text + '<span class="cursor"></span>';
                    isComplete = true;
                    // 可选的：完成后停留，不做额外操作
                }
            }

            // 启动打字机 (进入页面即开始)
            // 为了更自然，先清空，然后开始
            typewriterEl.innerHTML = '<span class="cursor"></span>';
            setTimeout(typeStep, 400);

            // ============================================================
            // 2. 下载按钮 — 跳转到蓝奏云
            // ============================================================
            const LANZOU_URL = 'https://wwbbx.lanzouw.com/iclqQ42ewjjg';
            const downloadBtn = document.getElementById('downloadBtn');

            downloadBtn.addEventListener('click', function(e) {
                // 点击后跳转
                window.location.href = LANZOU_URL;
            });

            // ============================================================
            // 3. 额外：点击小鱼无操作，保持待机感
            // ============================================================
            // 小鱼仅做装饰，不做任何交互

            console.log('🐟 纯净管理鱼缸 · 已加载');
        })();
    </script>

</body>
</html>
