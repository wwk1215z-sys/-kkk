<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>纯净 · 管理鱼缸</title>
    <style>
        /* ===== 极简重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 24px;
        }

        /* ===== 主容器 ===== */
        .container {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.02);
        }

        /* ===== 打字机标题（两行，超大） ===== */
        .title-wrapper {
            width: 100%;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
        }

        #typewriter {
            font-size: clamp(48px, 11vw, 72px);
            font-weight: 700;
            color: #000000;
            letter-spacing: 0.5px;
            line-height: 1.25;
            text-align: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 1.4em;
            word-break: keep-all;
        }

        #typewriter .line {
            display: block;
        }

        /* 打字光标 */
        .cursor {
            display: inline-block;
            width: 3px;
            height: 0.85em;
            background: #000;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.9s step-end infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        /* ===== 鲨鱼区域（可长按） ===== */
        .fish-area {
            width: 100%;
            padding: 16px 0 16px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            -webkit-touch-callout: none;
            position: relative;
        }

        /* 外层包裹：负责左右移动（幅度极小，流畅非线性） */
        .fish-wrapper {
            display: inline-block;
            animation: swimHorizontal 3.4s ease-in-out infinite;
            will-change: transform;
            transform-origin: center center;
            transition: transform 0.1s ease;
        }

        /* 左右移动 — 非常浅的幅度，流畅 */
        @keyframes swimHorizontal {
            0% {
                transform: translateX(-12px);
            }
            50% {
                transform: translateX(12px);
            }
            100% {
                transform: translateX(-12px);
            }
        }

        /* 鲨鱼本身 */
        .fish-emoji {
            font-size: clamp(90px, 28vw, 150px);
            line-height: 1;
            display: block;
            filter: drop-shadow(0 4px 20px rgba(100, 150, 200, 0.15));
            user-select: none;
            transition: transform 0.15s ease;
            will-change: transform;
        }

        /* ===== 弹窗 (高斯模糊背景) ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
            padding: 24px;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                backdrop-filter: blur(0px);
            }
            100% {
                opacity: 1;
                backdrop-filter: blur(12px);
            }
        }

        .modal-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            animation: scaleIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0.85);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
            color: #888;
            transition: color 0.2s;
            background: none;
            border: none;
            padding: 4px 8px;
        }

        .modal-close:hover {
            color: #000;
        }

        .modal-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        .modal-title {
            font-size: 28px;
            font-weight: 600;
            color: #000;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .modal-sub {
            font-size: 18px;
            color: #333;
            font-weight: 400;
            letter-spacing: 0.3px;
            padding: 0 4px;
        }

        .modal-sub strong {
            font-weight: 600;
            color: #000;
        }

        .modal-hint {
            margin-top: 20px;
            font-size: 14px;
            color: #999;
            letter-spacing: 0.3px;
        }

        /* ===== 下载按钮 ===== */
        .download-section {
            width: 100%;
            margin-top: 28px;
            display: flex;
            justify-content: center;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #000000;
            color: #ffffff;
            font-size: clamp(18px, 4vw, 22px);
            font-weight: 500;
            padding: 16px 48px;
            border-radius: 60px;
            border: none;
            outline: none;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            letter-spacing: 0.3px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-decoration: none;
            user-select: none;
            width: 100%;
            max-width: 320px;
        }

        .download-btn:hover {
            background: #1a1a1a;
            transform: scale(1.01);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
        }

        .download-btn:active {
            transform: scale(0.97);
            background: #2a2a2a;
        }

        .download-btn .icon {
            font-size: 1.2em;
            line-height: 1;
            transition: transform 0.2s ease;
        }

        .download-btn:hover .icon {
            transform: translateY(1px);
        }

        /* ===== 脚标 ===== */
        .footer-note {
            margin-top: 24px;
            font-size: 13px;
            color: #aaaaaa;
            letter-spacing: 0.5px;
            font-weight: 400;
            transition: color 0.2s;
        }

        .footer-note:hover {
            color: #888888;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .container {
                padding: 28px 16px;
            }

            .download-btn {
                padding: 14px 32px;
                font-size: 17px;
                max-width: 260px;
            }

            #typewriter {
                font-size: clamp(38px, 9vw, 52px);
            }

            .fish-emoji {
                font-size: 80px;
            }

            .modal-card {
                padding: 36px 24px;
            }
            .modal-title {
                font-size: 24px;
            }
            .modal-sub {
                font-size: 16px;
            }
        }

        @media (max-width: 380px) {
            #typewriter {
                font-size: 32px;
            }

            .fish-emoji {
                font-size: 68px;
            }

            .download-btn {
                padding: 12px 24px;
                font-size: 15px;
                max-width: 220px;
            }

            .modal-card {
                padding: 28px 20px;
            }
            .modal-title {
                font-size: 20px;
            }
            .modal-sub {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 打字机标题（两行） -->
        <div class="title-wrapper">
            <div id="typewriter"></div>
        </div>

        <!-- 可长按的鲨鱼 -->
        <div class="fish-area" id="fishArea">
            <span class="fish-wrapper" id="fishWrapper">
                <span class="fish-emoji" id="fishEmoji">🦈</span>
            </span>
        </div>

        <!-- 下载按钮 -->
        <div class="download-section">
            <button class="download-btn" id="downloadBtn">
                <span class="icon">⬇</span>
                下载软件
                <span style="font-size:0.7em; opacity:0.6; font-weight:300;">·</span>
                <span style="font-weight:300; font-size:0.8em; opacity:0.7;">蓝奏云</span>
            </button>
        </div>

        <!-- 脚标 -->
        <div class="footer-note">管理鱼缸 · 纯净版</div>
    </div>

    <!-- ===== 弹窗 ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <button class="modal-close" id="modalClose">✕</button>
            <span class="modal-icon">🦈</span>
            <div class="modal-title">关注快手</div>
            <div class="modal-sub"><strong>小凯是神</strong></div>
            <div class="modal-hint">长按鲨鱼触发 · 感谢关注</div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. 打字机效果 — 两行，超大
            // ============================================================
            const lines = ['纯净的', '管理鱼缸软件'];
            const typewriterEl = document.getElementById('typewriter');
            let lineIndex = 0;
            let charIndex = 0;

            function typeStep() {
                if (lineIndex < lines.length) {
                    const currentLine = lines[lineIndex];
                    if (charIndex < currentLine.length) {
                        let displayHtml = '';
                        for (let i = 0; i < lines.length; i++) {
                            if (i < lineIndex) {
                                displayHtml += `<span class="line">${lines[i]}</span>`;
                            } else if (i === lineIndex) {
                                const partial = currentLine.substring(0, charIndex + 1);
                                displayHtml += `<span class="line">${partial}<span class="cursor"></span></span>`;
                            } else {
                                displayHtml += `<span class="line"></span>`;
                            }
                        }
                        typewriterEl.innerHTML = displayHtml;
                        charIndex++;
                        const delay = 55 + Math.random() * 30;
                        setTimeout(typeStep, delay);
                    } else {
                        lineIndex++;
                        charIndex = 0;
                        if (lineIndex < lines.length) {
                            setTimeout(typeStep, 200);
                        } else {
                            let finalHtml = '';
                            for (let i = 0; i < lines.length; i++) {
                                finalHtml += `<span class="line">${lines[i]}</span>`;
                            }
                            typewriterEl.innerHTML = finalHtml + '<span class="cursor"></span>';
                        }
                    }
                }
            }

            typewriterEl.innerHTML = '<span class="line"><span class="cursor"></span></span>';
            setTimeout(typeStep, 300);

            // ============================================================
            // 2. 下载按钮 — 蓝奏云
            // ============================================================
            const LANZOU_URL = 'https://wwbbx.lanzouw.com/iclqQ42ewjjg';
            const downloadBtn = document.getElementById('downloadBtn');

            downloadBtn.addEventListener('click', function(e) {
                window.location.href = LANZOU_URL;
            });

            // ============================================================
            // 3. 长按鲨鱼 → 弹出高斯模糊弹窗
            // ============================================================
            const fishArea = document.getElementById('fishArea');
            const fishEmoji = document.getElementById('fishEmoji');
            const fishWrapper = document.getElementById('fishWrapper');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalClose = document.getElementById('modalClose');

            let holdTimer = null;
            let isHolding = false;

            // 长按阈值 700ms
            const HOLD_DURATION = 700;

            // 显示弹窗
            function showModal() {
                if (modalOverlay.classList.contains('active')) return;
                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            // 隐藏弹窗
            function hideModal() {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            // 清除长按计时器
            function clearHoldTimer() {
                if (holdTimer) {
                    clearTimeout(holdTimer);
                    holdTimer = null;
                }
                isHolding = false;
                fishEmoji.style.transform = 'scale(1)';
                fishWrapper.style.transform = '';
            }

            // 开始长按计时
            function startHold(e) {
                if (modalOverlay.classList.contains('active')) return;
                clearHoldTimer();
                fishEmoji.style.transform = 'scale(0.92)';
                isHolding = true;
                holdTimer = setTimeout(() => {
                    if (isHolding) {
                        showModal();
                        fishEmoji.style.transform = 'scale(1)';
                        isHolding = false;
                        holdTimer = null;
                    }
                }, HOLD_DURATION);
            }

            // 取消长按
            function cancelHold(e) {
                clearHoldTimer();
                if (!modalOverlay.classList.contains('active')) {
                    fishEmoji.style.transform = 'scale(1)';
                }
            }

            // ---- 鼠标事件 ----
            fishArea.addEventListener('mousedown', startHold);
            fishArea.addEventListener('mouseup', cancelHold);
            fishArea.addEventListener('mouseleave', cancelHold);

            // ---- 触摸事件 ----
            fishArea.addEventListener('touchstart', function(e) {
                e.preventDefault();
                startHold(e);
            }, { passive: false });

            fishArea.addEventListener('touchend', function(e) {
                e.preventDefault();
                cancelHold(e);
            }, { passive: false });

            fishArea.addEventListener('touchcancel', function(e) {
                e.preventDefault();
                cancelHold(e);
            }, { passive: false });

            // ---- 弹窗关闭 ----
            modalClose.addEventListener('click', hideModal);
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    hideModal();
                }
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    hideModal();
                }
            });

            console.log('🦈 长按鲨鱼 → 关注抖音小凯是神！');
        })();
    </script>

</body>
</html>
