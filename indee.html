<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>纯净 · 管理鱼缸</title>
    <style>
        /* ===== 极简重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 24px;
        }

        /* ===== 主容器 ===== */
        .container {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.02);
            transition: all 0.2s;
        }

        /* ===== 打字机标题 ===== */
        .title-wrapper {
            width: 100%;
            min-height: 64px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 28px;
        }

        #typewriter {
            font-size: clamp(26px, 6vw, 38px);
            font-weight: 600;
            color: #000000;
            letter-spacing: 0.5px;
            line-height: 1.3;
            text-align: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 1.4em;
            word-break: keep-all;
        }

        /* 打字光标 */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 0.9em;
            background: #000;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.9s step-end infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        /* ===== 小鱼区域（可点击） ===== */
        .fish-area {
            width: 100%;
            padding: 30px 0 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            /* 点击鱼触发 */;
        }

        .fish-emoji {
            font-size: clamp(80px, 25vw, 140px);
            line-height: 1;
            display: inline-block;
            /* 左右游动动画 */
            animation: swimHorizontal 4.2s ease-in-out infinite;
            filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.03));
            user-select: none;
            transition: transform 0.15s ease;
            will-change: transform;
        }

        /* 左右游动关键帧 */
        @keyframes swimHorizontal {
            0% {
                transform: translateX(-50px) scaleX(1);
            }
            25% {
                transform: translateX(30px) scaleX(1);
            }
            50% {
                transform: translateX(60px) scaleX(1);
            }
            75% {
                transform: translateX(-30px) scaleX(1);
            }
            100% {
                transform: translateX(-50px) scaleX(1);
            }
        }

        /* 点击时的缩放反馈 */
        .fish-emoji:active {
            transform: scale(0.92);
        }

        /* ===== 下载按钮 ===== */
        .download-section {
            width: 100%;
            margin-top: 32px;
            display: flex;
            justify-content: center;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #000000;
            color: #ffffff;
            font-size: clamp(18px, 4vw, 22px);
            font-weight: 500;
            padding: 16px 48px;
            border-radius: 60px;
            border: none;
            outline: none;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            letter-spacing: 0.3px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-decoration: none;
            user-select: none;
            width: 100%;
            max-width: 320px;
        }

        .download-btn:hover {
            background: #1a1a1a;
            transform: scale(1.01);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
        }

        .download-btn:active {
            transform: scale(0.97);
            background: #2a2a2a;
        }

        .download-btn .icon {
            font-size: 1.2em;
            line-height: 1;
            transition: transform 0.2s ease;
        }

        .download-btn:hover .icon {
            transform: translateY(1px);
        }

        /* ===== 脚标 ===== */
        .footer-note {
            margin-top: 24px;
            font-size: 13px;
            color: #aaaaaa;
            letter-spacing: 0.5px;
            font-weight: 400;
            transition: color 0.2s;
        }

        .footer-note:hover {
            color: #888888;
        }

        /* ===== 爆炸效果（临时） ===== */
        .fish-emoji.explode {
            animation: explodeAnim 0.6s ease forwards;
        }

        @keyframes explodeAnim {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
            30% {
                transform: scale(1.8) rotate(20deg);
                opacity: 0.9;
            }
            60% {
                transform: scale(2.4) rotate(-30deg);
                opacity: 0.6;
            }
            100% {
                transform: scale(0.1) rotate(40deg);
                opacity: 0;
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .container {
                padding: 28px 16px;
            }

            .download-btn {
                padding: 14px 32px;
                font-size: 17px;
                max-width: 260px;
            }

            #typewriter {
                font-size: 24px;
            }

            .fish-emoji {
                font-size: 72px;
            }
        }

        @media (max-width: 380px) {
            #typewriter {
                font-size: 20px;
            }

            .fish-emoji {
                font-size: 60px;
            }

            .download-btn {
                padding: 12px 24px;
                font-size: 15px;
                max-width: 220px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 打字机标题 -->
        <div class="title-wrapper">
            <div id="typewriter"></div>
        </div>

        <!-- 可点击的小鱼 -->
        <div class="fish-area" id="fishArea">
            <span class="fish-emoji" id="fishEmoji">🐠</span>
        </div>

        <!-- 下载按钮 -->
        <div class="download-section">
            <button class="download-btn" id="downloadBtn">
                <span class="icon">⬇</span>
                下载软件
                <span style="font-size:0.7em; opacity:0.6; font-weight:300;">·</span>
                <span style="font-weight:300; font-size:0.8em; opacity:0.7;">蓝奏云</span>
            </button>
        </div>

        <!-- 脚标 -->
        <div class="footer-note">管理鱼缸 · 纯净版</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. 打字机效果
            // ============================================================
            const text = '纯净的管理鱼缸软件';
            const typewriterEl = document.getElementById('typewriter');
            let index = 0;

            function typeStep() {
                if (index < text.length) {
                    const currentText = text.substring(0, index + 1);
                    typewriterEl.innerHTML = currentText + '<span class="cursor"></span>';
                    index++;
                    const delay = 55 + Math.random() * 30;
                    setTimeout(typeStep, delay);
                } else {
                    typewriterEl.innerHTML = text + '<span class="cursor"></span>';
                }
            }

            typewriterEl.innerHTML = '<span class="cursor"></span>';
            setTimeout(typeStep, 400);

            // ============================================================
            // 2. 下载按钮 — 蓝奏云
            // ============================================================
            const LANZOU_URL = 'https://wwbbx.lanzouw.com/iclqQ42ewjjg';
            const downloadBtn = document.getElementById('downloadBtn');

            downloadBtn.addEventListener('click', function(e) {
                window.location.href = LANZOU_URL;
            });

            // ============================================================
            // 3. 小鱼点击互动 — 逐渐愤怒 → 爆炸
            // ============================================================
            const fishEmoji = document.getElementById('fishEmoji');
            const fishArea = document.getElementById('fishArea');

            // 愤怒阶段表情 (从正常到爆炸)
            const emotionStages = [
                '🐠', // 0 初始
                '😤', // 1-2
                '😤', // 2
                '😡', // 3-4
                '😡', // 4
                '🤬', // 5-6
                '🤬', // 6
                '👿', // 7-8
                '👿', // 8
                '🔥', // 9
                '💥' // 10 爆炸
            ];

            let clickCount = 0;
            let isExploded = false; // 防止爆炸后继续点击

            // 点击事件（绑定到鱼区域）
            fishArea.addEventListener('click', function(e) {
                if (isExploded) {
                    // 如果已爆炸，点击重置（重新开始）
                    resetFish();
                    return;
                }

                clickCount++;
                // 限制最多10次
                if (clickCount > 10) clickCount = 10;

                // 更新表情
                const newEmoji = emotionStages[clickCount] || '💥';
                fishEmoji.textContent = newEmoji;

                // 如果是第10次，触发爆炸
                if (clickCount === 10) {
                    explodeFish();
                } else {
                    // 每次点击加一点抖动反馈
                    fishEmoji.style.transform = 'scale(0.9)';
                    setTimeout(() => {
                        fishEmoji.style.transform = '';
                    }, 150);
                }
            });

            // 爆炸函数
            function explodeFish() {
                isExploded = true;
                fishEmoji.classList.add('explode');
                // 爆炸后，延迟重置（让爆炸动画播放完）
                setTimeout(() => {
                    // 重置小鱼
                    resetFish();
                }, 700);
            }

            // 重置小鱼到初始状态
            function resetFish() {
                clickCount = 0;
                isExploded = false;
                fishEmoji.textContent = '🐠';
                fishEmoji.classList.remove('explode');
                fishEmoji.style.transform = '';
                // 重新开始动画（移除并重新添加动画）
                fishEmoji.style.animation = 'none';
                requestAnimationFrame(() => {
                    fishEmoji.style.animation = 'swimHorizontal 4.2s ease-in-out infinite';
                });
            }

            // 小优化：鼠标移上鱼时改变光标
            fishArea.style.cursor = 'pointer';

            console.log('🐠 点击小鱼十次会爆炸哦！');
        })();
    </script>

</body>
</html>
